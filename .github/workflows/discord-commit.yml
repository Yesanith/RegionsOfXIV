name: Discord Commit Notification

on:
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit info to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.COMMITWEBHOOK }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_COUNT=$(echo "$COMMITS_JSON" | jq 'length')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build a GitHub-style commit list:
          # [`hash`](url) message - author
          DESCRIPTION=$(echo "$COMMITS_JSON" | jq -r '
            [.[] | "[`" + (.id[0:7]) + "`](" + .url + ") " + (.message | split("\n")[0]) + " - " + .author.name]
            | join("\n")
          ')

          if [ "$COMMIT_COUNT" -eq 1 ]; then
            TITLE_TEXT="1 new commit pushed to ${BRANCH_NAME}"
          else
            TITLE_TEXT="${COMMIT_COUNT} new commits pushed to ${BRANCH_NAME}"
          fi

          # Build the final JSON payload safely with jq (handles escaping for us)
          PAYLOAD=$(jq -n \
            --arg title "$TITLE_TEXT" \
            --arg desc "$DESCRIPTION" \
            --arg url "${{ github.event.compare }}" \
            --arg footer "${REPO_NAME} · GitHub Actions" \
            --arg timestamp "$TIMESTAMP" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 10181046,
                thumbnail: {
                  url: "https://raw.githubusercontent.com/Yesanith/RegionsOfXIV/master/assets/images/icon.png"
                },
                footer: {
                  text: $footer,
                  icon_url: "https://github.githubassets.com/favicons/favicon.png"
                },
                timestamp: $timestamp
              }]
            }')

          curl -sfS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"