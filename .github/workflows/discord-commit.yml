name: Discord Commit Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit info to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s "${{ github.sha }}" | sed 's/"/\\"/g')
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          curl -sfS -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"New commit on ${REPO_NAME}\",
                \"description\": \"${COMMIT_MSG}\",
                \"url\": \"${COMMIT_URL}\",
                \"color\": 3447003,
                \"fields\": [
                  { \"name\": \"Branch\", \"value\": \"${BRANCH_NAME}\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"${SHORT_SHA}\", \"inline\": true },
                  { \"name\": \"Author\", \"value\": \"${COMMIT_AUTHOR}\", \"inline\": true }
                ]
              }]
            }" \
            "$DISCORD_WEBHOOK"